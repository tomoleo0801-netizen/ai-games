<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#cdeeff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>めばえ ― 芽をそだてるミニゲーム</title>
<style>
:root{
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --ink:#2d4a26;
  --font:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#cdeeff;color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{position:fixed;top:0;right:0;bottom:0;left:0}
#c{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;top:calc(var(--sat) + 8px);left:50%;transform:translateX(-50%);width:min(100%,600px);
  padding:0 calc(10px + var(--sar)) 0 calc(10px + var(--sal));display:flex;align-items:flex-start;gap:8px;
  pointer-events:none;transition:opacity .35s}
#hud.off{opacity:0;visibility:hidden}
.pill{background:rgba(255,255,255,.84);border-radius:16px;box-shadow:0 2px 8px rgba(20,60,30,.16)}
.h-left{padding:4px 12px 5px;min-width:94px}
#hHeight{font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
#hHeight small{font-size:13px;margin-left:2px}
#hBest{font-size:11px;opacity:.7;white-space:nowrap;min-height:13px}
.h-mid{flex:1;padding:7px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.row{display:flex;align-items:center;gap:7px;position:relative}
.ico{width:18px;height:18px;flex:0 0 18px}
.bar{position:relative;flex:1;height:13px;border-radius:7px;background:rgba(40,90,140,.16);overflow:hidden}
#hWater{position:absolute;top:0;right:0;bottom:0;left:0;transform-origin:left center;background:linear-gradient(#8fdcff,#2f9be0);border-radius:7px}
.low #hWater{background:linear-gradient(#ffc0a8,#ff6047);animation:blink .45s infinite alternate}
@keyframes blink{to{opacity:.45}}
.suns{display:flex;gap:6px;flex:1;position:relative;height:14px;align-items:center}
.suns i{width:13px;height:13px;border-radius:50%;background:rgba(200,160,40,.2);box-shadow:inset 0 1px 2px rgba(0,0,0,.15);transition:transform .2s}
.suns i.on{background:radial-gradient(circle at 35% 35%,#fff6c0,#ffc21a);box-shadow:0 0 6px #ffd84d;transform:scale(1.15)}
#hBoost{position:absolute;top:-1px;right:0;bottom:-1px;left:0;border-radius:8px;background:rgba(255,236,150,.6);overflow:hidden;display:none}
#hBoostFill{position:absolute;top:0;right:0;bottom:0;left:0;transform-origin:left center;background:linear-gradient(90deg,#ffe066,#ffb000)}
#hBoost span{position:relative;display:block;text-align:center;font-size:11px;font-weight:800;line-height:16px;color:#7a4a00;letter-spacing:1px}
#hud.boosting #hBoost{display:block}
.h-right{display:flex;gap:6px;pointer-events:auto}
.ibtn{width:42px;height:42px;border:none;border-radius:50%;background:rgba(255,255,255,.84);box-shadow:0 2px 8px rgba(20,60,30,.16);
  display:grid;place-items:center;color:var(--ink);padding:0}
.ibtn svg{width:22px;height:22px}
.ibtn:active{transform:scale(.92)}

/* ---------- 画面の上にのせるカード ---------- */
.ov{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  padding:calc(var(--sat) + 14px) calc(var(--sar) + 14px) calc(var(--sab) + 14px) calc(var(--sal) + 14px)}
.card{pointer-events:auto;width:100%;max-width:380px;max-height:100%;overflow:auto;background:rgba(255,255,255,.88);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:24px;box-shadow:0 12px 36px rgba(30,70,40,.22);
  padding:18px 20px 20px;text-align:center}
.btn{display:block;width:100%;margin:14px auto 0;padding:14px 18px;border:none;border-radius:999px;font-size:20px;font-weight:800;color:#fff;
  background:linear-gradient(#7ad35a,#43a531);box-shadow:0 5px 0 #2f7d25,0 10px 18px rgba(40,120,40,.28);letter-spacing:2px;
  transition:transform .08s,box-shadow .08s;text-shadow:0 1px 0 rgba(0,60,0,.3)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #2f7d25,0 4px 8px rgba(40,120,40,.3)}
.btn.sub{background:linear-gradient(#fff,#eef3ea);color:var(--ink);box-shadow:0 4px 0 #c5d3bf,0 8px 14px rgba(40,90,40,.15);font-size:16px;padding:11px;text-shadow:none}
.btn:focus-visible,.ibtn:focus-visible{outline:3px solid #ffb000;outline-offset:3px}
.key{display:inline-block;font-size:11px;opacity:.6;margin-top:6px}

#title{align-items:flex-start;padding-top:calc(var(--sat) + 4vh)}
.logo-wrap{display:flex;flex-direction:column;align-items:center}
.logo-sprout{width:58px;height:48px;margin-bottom:-6px}
.logo{margin:0;font-size:54px;font-weight:900;letter-spacing:8px;padding-left:8px;color:#5cbf3f;line-height:1.15;
  text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 6px 0 #2f7d25,0 9px 14px rgba(30,90,30,.25)}
.sub{margin:6px 0 0;font-size:14px;font-weight:700;opacity:.8}
.howto{list-style:none;margin:12px 0 2px;padding:0;text-align:left;font-size:14px;line-height:1.45}
.howto li{display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px dashed rgba(60,110,50,.2)}
.howto li:last-child{border-bottom:none}
.howto svg{flex:0 0 28px;width:28px;height:28px}
.best{margin:10px 0 0;font-size:14px;font-weight:700;min-height:1em}

#pause{background:rgba(20,40,30,.28)}
.p-title{font-size:26px;font-weight:900;margin:4px 0 4px}
.p-msg{margin:0 0 6px;font-size:14px;opacity:.8}

#result.bottom{align-items:flex-end}
#result.side{justify-content:flex-end}
#result .card{opacity:0;transform:translateY(26px);transition:opacity .45s,transform .5s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
#result.show .card{opacity:1;transform:none;pointer-events:auto}
.r-label{margin:0;font-size:14px;opacity:.75}
.r-height{font-size:46px;font-weight:900;line-height:1.12;color:#3f9a2c;font-variant-numeric:tabular-nums}
.r-height small{font-size:20px;margin-left:2px}
.r-rank{font-size:21px;font-weight:800}
.r-msg{font-size:14px;margin:2px 0 10px;opacity:.85}
.r-stats{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;font-size:14px}
.r-stats span{background:rgba(120,180,90,.16);border-radius:999px;padding:5px 12px;white-space:nowrap}
.r-new{display:inline-block;margin-top:10px;padding:3px 14px;border-radius:999px;background:#ffd84d;color:#7a4a00;font-weight:800;font-size:14px;animation:pop .7s .4s ease-out both}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}

/* ---------- 文字のおしらせ ---------- */
#toast{position:fixed;left:50%;top:23%;font-size:min(26px,6.6vw);font-weight:900;color:#fff;white-space:nowrap;pointer-events:none;opacity:0;
  transform:translate(-50%,0);
  text-shadow:0 2px 0 #2f7d25,2px 0 0 #2f7d25,-2px 0 0 #2f7d25,0 -2px 0 #2f7d25,2px 2px 0 #2f7d25,-2px 2px 0 #2f7d25,2px -2px 0 #2f7d25,-2px -2px 0 #2f7d25,0 6px 12px rgba(0,0,0,.25)}
#toast.show{animation:toast 1.7s ease-out forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}12%{opacity:1;transform:translate(-50%,0) scale(1.08)}
  20%{transform:translate(-50%,0) scale(1)}78%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-14px) scale(1)}}
#hint{position:fixed;left:50%;bottom:calc(var(--sab) + 8vh);transform:translateX(-50%);background:rgba(255,255,255,.88);padding:9px 18px;border-radius:999px;
  font-size:15px;font-weight:800;white-space:nowrap;opacity:0;transition:opacity .45s;pointer-events:none;box-shadow:0 4px 12px rgba(20,60,30,.18)}
#hint.show{opacity:1}
#hint b{display:inline-block;color:#43a531;animation:nudgeL .7s ease-in-out infinite alternate}
#hint b+span+b{animation-name:nudgeR}
@keyframes nudgeL{to{transform:translateX(-5px)}}
@keyframes nudgeR{to{transform:translateX(5px)}}

@media (max-height:640px){
  .logo{font-size:42px}.logo-sprout{width:46px;height:38px}
  .howto{font-size:13px;margin-top:8px}.howto li{padding:4px 2px}.howto svg{width:24px;height:24px;flex-basis:24px}
  .btn{padding:11px 16px;font-size:18px;margin-top:10px}
  .card{padding:14px 16px 16px}
  .r-height{font-size:38px}.r-rank{font-size:18px}.r-msg{margin-bottom:6px}
}
@media (max-height:440px){
  .logo-sprout,.sub{display:none}.logo{font-size:32px}
  #title{padding-top:calc(var(--sat) + 8px)}
  #title .card{max-width:620px}
  .howto{font-size:12px;line-height:1.3;display:grid;grid-template-columns:1fr 1fr;column-gap:14px}.howto li{padding:3px 2px;border-bottom:none}
  .r-height{font-size:30px}.r-label{font-size:12px}.r-new{margin-top:6px}
}
</style>
</head>
<body>
<canvas id="c" aria-label="ゲーム画面"></canvas>

<!-- HUD -->
<div id="hud" class="off">
  <div class="pill h-left">
    <div id="hHeight">0<small>cm</small></div>
    <div id="hBest"></div>
  </div>
  <div class="pill h-mid">
    <div class="row" id="hWaterRow">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5C9 7 5.5 10.5 5.5 14.5a6.5 6.5 0 0 0 13 0C18.5 10.5 15 7 12 2.5z" fill="#46aef0" stroke="#2a86c8" stroke-width="1.5"/><ellipse cx="9.6" cy="14.5" rx="1.3" ry="2.2" fill="#fff" opacity=".85"/></svg>
      <div class="bar"><div id="hWater"></div></div>
    </div>
    <div class="row">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.8v3M12 19.2v3M1.8 12h3M19.2 12h3M4.8 4.8l2.1 2.1M17.1 17.1l2.1 2.1M4.8 19.2l2.1-2.1M17.1 6.9l2.1-2.1" stroke="#f5a500" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="5.2" fill="#ffd23f" stroke="#f5a500" stroke-width="1.5"/></svg>
      <div class="suns" id="hSuns"><i></i><i></i><i></i><i></i><i></i>
        <div id="hBoost"><div id="hBoostFill"></div><span>ぐんぐん！</span></div>
      </div>
    </div>
  </div>
  <div class="h-right">
    <button class="ibtn" id="bSound" aria-label="音のオン・オフ"></button>
    <button class="ibtn" id="bPause" aria-label="いちじていし"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.5" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.5" fill="currentColor"/></svg></button>
  </div>
</div>

<!-- タイトル -->
<div id="title" class="ov">
  <div class="card">
    <div class="logo-wrap">
      <svg class="logo-sprout" viewBox="0 0 60 50" aria-hidden="true">
        <path d="M30 50 C30 40 30 34 30 26" stroke="#3f9a2c" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M30 27 C22 30 8 26 5 12 C18 9 28 16 30 27z" fill="#7fd650" stroke="#2e6b27" stroke-width="2"/>
        <path d="M30 27 C38 30 52 26 55 12 C42 9 32 16 30 27z" fill="#95e06a" stroke="#2e6b27" stroke-width="2"/>
      </svg>
      <h1 class="logo">めばえ</h1>
      <p class="sub">〜 芽を そだてる ミニゲーム 〜</p>
    </div>
    <ul class="howto">
      <li><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 16l6-6v4h14v-4l6 6-6 6v-4H9v4z" fill="#5cbf3f" stroke="#2e6b27" stroke-width="1.4" stroke-linejoin="round"/></svg><span id="howSteer">指のほうへ 芽がのびるよ</span></li>
      <li><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C12 9 7.5 13.5 7.5 19a8.5 8.5 0 0 0 17 0C24.5 13.5 20 9 16 3z" fill="#46aef0" stroke="#2a86c8" stroke-width="1.8"/><ellipse cx="12.6" cy="19" rx="1.7" ry="2.9" fill="#fff" opacity=".85"/></svg><span>しずくで 水をほきゅう。<br>水がなくなると おしまい</span></li>
      <li><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2v4M16 26v4M2 16h4M26 16h4M6 6l3 3M23 23l3 3M6 26l3-3M23 9l3-3" stroke="#f5a500" stroke-width="2.4" stroke-linecap="round"/><circle cx="16" cy="16" r="7" fill="#ffd23f" stroke="#f5a500" stroke-width="1.8"/></svg><span>ひかりを 5こ 集めると<br>「ぐんぐんタイム」で むてき！</span></li>
      <li><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="8" cy="20" r="5" fill="#a6dd55" stroke="#4c8a22" stroke-width="1.5"/><circle cx="15" cy="20" r="5.3" fill="#8fd14a" stroke="#4c8a22" stroke-width="1.5"/><circle cx="23" cy="18" r="6.5" fill="#7cc53c" stroke="#4c8a22" stroke-width="1.5"/><circle cx="21" cy="17" r="1.6" fill="#222"/><circle cx="25.5" cy="17" r="1.6" fill="#222"/></svg><span>いもむし・鳥・かみなり雲に<br>ぶつからないように！</span></li>
    </ul>
    <button class="btn" id="bStart">はじめる</button>
    <p class="best" id="titleBest"></p>

</div>

<!-- 一時停止 -->
<div id="pause" class="ov hidden">
  <div class="card">
    <div class="p-title">ひとやすみ</div>
    <p class="p-msg">芽も ちょっと きゅうけい中…</p>
    <button class="btn" id="bResume">つづける</button>
    <button class="btn sub" id="bRestart">さいしょから</button>
  </div>
</div>

<!-- 結果 -->
<div id="result" class="ov hidden bottom">
  <div class="card" id="rCard">
    <p class="r-label">きょうの 芽は…</p>
    <div class="r-height" id="rHeight">0<small>cm</small></div>
    <div class="r-rank" id="rRank">「ふたば」</div>
    <p class="r-msg" id="rMsg"></p>
    <div class="r-stats"><span>さいた花 <b id="rFlowers">0</b>こ</span><span>ベスト <b id="rBest">0cm</b></span></div>
    <div class="r-new hidden" id="rNew">ベスト こうしん！</div>
    <button class="btn" id="bRetry">もういちど</button>
  </div>
</div>

<div id="toast"></div>
<div id="hint"><b>◀</b> <span id="hintText">指で みちびこう</span> <b>▶</b></div>

<script>
(() => {
'use strict';

/* =========================================================
   小さな道具
   ========================================================= */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOutBack = t => { const c = 1.70158; t -= 1; return 1 + (c + 1) * t * t * t + c * t * t; };
const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function mulberry32(a) {
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const $ = id => document.getElementById(id);

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 保存できなくても遊べる */ } }
};

const fmtTxt = cm => (cm < 100 ? `${cm}cm` : `${(cm / 100).toFixed(2)}m`);
const fmtHTML = cm => (cm < 100 ? `${cm}<small>cm</small>` : `${(cm / 100).toFixed(2)}<small>m</small>`);

/* =========================================================
   定数
   ========================================================= */
const W = 400;                       // 遊ぶ場所の横はば（ワールド単位）
const SEED = { x: 200, y: 118 };     // 種の位置（y が大きいほど下。地面は y=0）
const MAXH = 1.15;                   // 芽がかたむける最大の角度
const FONT = '"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif';
const FLOWER_COLS = ['#ff9ec7', '#ffd84d', '#ffffff', '#c9a7ff', '#ff8f7a', '#8fd3ff', '#ffb35c'];
const LEAF_PAL = [['#86dc5c', '#5fb841'], ['#7ad152', '#56ad3a'], ['#95e06a', '#6cc04c']];
const SKY = [
  [0, '#fff0d4'], [350, '#d4efff'], [1500, '#a6dbff'], [3000, '#78bdf3'], [5000, '#4f8ad8'],
  [7000, '#3a55a6'], [9000, '#222a6e'], [11000, '#11143c'], [14000, '#080820']
].map(([h, c]) => [h, hex(c)]);
const RANKS = [
  [0, 'ふたば', 'まだまだ これから！', '#ffb3c7'],
  [50, 'わかば', 'すくすく 育ってきたね', '#ffe066'],
  [150, 'すくすく草', 'りっぱな 草に なったね', '#ff9ec7'],
  [300, 'くもまで草', '雲に とどきそう！', '#ffffff'],
  [500, 'そらのつる', '空の上まで のびたね！', '#c9a7ff'],
  [800, 'ほしのつる', '星に 手が とどきそう！', '#8fd3ff'],
  [1000, 'うちゅうの大樹', 'でんせつの 芽だ…！', '#ff8f6b']
];
const MILESTONES = [
  [500, '50cm！ いいちょうし'],
  [1000, '1m とっぱ！'],
  [1500, '鳥が とんでるよ！'],
  [2000, '2m！ ぐんぐん のびる'],
  [3000, '3m！ 雲の高さ'],
  [3800, 'かみなり雲に ちゅうい！'],
  [5000, '5m！ 空のずっと上'],
  [7000, '7m！ 夜空が みえてきた'],
  [8500, 'いん石に ちゅうい！'],
  [10000, '10m！ うちゅうに とどいた！']
];

/* むずかしさ：高くなるほど速く、水がへりやすい */
const diff = h => 1 - Math.exp(-Math.max(0, h) / 6000);
const speedAt = h => 90 + 85 * diff(h);
const drainAt = h => 3.6 + 5.4 * (1 - Math.exp(-Math.max(0, h) / 7000)) + Math.max(0, h - 10000) * 0.0002;
const stemW = age => 4.2 + 7.8 * sstep(0, 1100, age);
const sizeBoostFor = z => Math.max(1, Math.pow(0.45 / z, 0.75));

function skyAt(h) {
  if (h <= SKY[0][0]) return SKY[0][1];
  for (let i = 0; i < SKY.length - 1; i++) {
    if (h < SKY[i + 1][0]) return mix(SKY[i][1], SKY[i + 1][1], (h - SKY[i][0]) / (SKY[i + 1][0] - SKY[i][0]));
  }
  return SKY[SKY.length - 1][1];
}

/* =========================================================
   けしき（最初に一度だけ作る）
   ========================================================= */
const R0 = mulberry32(20261106);
const PEBBLES = [];
for (let i = 0; i < 280; i++) {
  const p = { x: -900 + R0() * 2200, y: 16 + R0() * 540, rx: 2 + R0() * 6, ry: 1.5 + R0() * 3.5, a: R0() * 3,

const A = {
  ctx: null, master: null, sfx: null, mus: null, noiseBuf: null, on: store.get('mebae_sound', true) !== false,
  init() {

    try{if(navigator.audioSession&&navigator.audioSession.type!=='playback')navigator.audioSession.type='playback';}catch(e){} const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;

    this.master = c.createGain(); this.master.gain.value = this.on ? 0.9 : 0; this.master.connect(c.destination);
    this.sfx = c.createGain(); this.sfx.connect(this.master);
    this.mus = c.createGain(); this.mus.gain.value = 0.8; this.mus.connect(this.master);
    const len = Math.floor(c.sampleRate * 0.5);
    this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    // iOS のための「音のロック解除」
    const s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0);
    if ((c.state === 'suspended'||c.state === 'interrupted')) c.resume();
  },
  set(on) {
    this.on = on; store.set('mebae_sound', on);
    if (this.master) this.master.gain.setTargetAtTime(on ? 0.9 : 0, this.ctx.currentTime, 0.03);
  },
  tone(f, dur, o = {}) {
    if (!this.ctx || !this.on) return;
    const c = this.ctx, t = o.at != null ? o.at : c.currentTime + (o.delay || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30, f * o.slide), t + dur);
    const v = o.vol == null ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t);

const Music = {
  on: false, timer: null, next: 0, step: 0, note: 5,
  start() {

  stop() { this.on = false; if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  tick() {

  const d = diff(h);
  switch (kind) {
    case 'bird': return { type: 'bird', x: rand(40, W - 40), y, vx: sign() * (48 + 62 * d + rand(0, 26)), ph: rand(0, TAU) };
    case 'storm': return { type: 'storm', x: rand(80, W - 80), y, w: rand(105, 140), ph: rand(0, TAU), flash: 0, boltSeed: 1 };
    case 'rock': {
      const r = rand(15, 23), shape = [];
      for (let k = 0; k < 9; k++) shape.push(rand(0.82, 1.1));
      return { type: 'rock', x: rand(40, W - 40), y, r, vx: sign() * rand(25, 55), rot: rand(0, TAU), vr: rand(-1.5, 1.5), shape };
    }
    default: return makeWorm(rand(50, W - 50), y, h);
  }
}
const makeRain = (x, y) => ({ type: 'rain', x, y, w: rand(120, 150), depth: 175, ph: rand(0, TAU) });
function pickObstacle(h) {
  const opts = [];
  if (h < 6500) opts.push(['worm', h < 5000 ? 1 : 0.5]);
  if (h > 1500) opts.push(['bird', 1]);
  if (h > 3800) opts.push(['storm', 0.75]);
  if (h > 8500) opts.push(['rock', 1.3]);
  let tot = 0;
  for (const o of opts) tot += o[1];
  let r = Math.random() * tot;
  for (const o of opts) { r -= o[1]; if (r <= 0) return o[0]; }
  return opts[opts.length - 1][0];
}
function spawnRow(y) {
  const h = -y, d = diff(h), E = game.ents;
  const obsP = h < 520 ? 0 : 0.26 + 0.28 * d;
  if (Math.random() < obsP) {
    const kind = pickObstacle(h);
    const o = makeObstacle(kind, y, h);
    E.push(o);
    if (kind === 'worm' && h > 2600 && Math.random() < 0.1 + 0.3 * d) {
      const x2 = o.ax < W / 2 ? rand(o.ax + 170, W - 40) : rand(40, o.ax - 170);
      if (x2 > 30 && x2 < W - 30) E.push(makeWorm(x2, y - rand(0, 30), h));
    }
    if (Math.random() < 0.42) { // ちょっと危ない場所に ごほうび
      let bx = rand(50, W - 50), by = y;
      if (kind === 'worm') { bx = o.ax + rand(-20, 20); by = y + 10; }
      else if (kind === 'storm') bx = clamp(o.x < W / 2 ? o.x + o.w * 0.5 + 34 : o.x - o.w * 0.5 - 34, 30, W - 30);
      E.push(Math.random() < 0.55 ? makeDrop(bx, by, false, h) : makeSun(bx, by));
    }
  } else {
    const q = Math.random();
    if (h > 1400 && h < 9000 && q < 0.085) E.push(makeRain(rand(80, W - 80), y));
    else if (q < 0.56) E.push(makeDrop(rand(36, W - 36), y + rand(-20, 20), false, h));
    else if (q < 0.7) { // 小さいしずくの列
      const x0 = rand(70, W - 70), dir = sign();
      for (let k = 0; k < 3; k++) E.push(makeDrop(clamp(x0 + dir * k * 26, 30, W - 30), y - k * 34, true, h));
    } else E.push(makeSun(rand(40, W - 40), y + rand(-20, 20)));
  }
}
function genContent() {
  const top = toWorldY(0) - 280;
  let guard = 0;
  while (game.genY > top && guard++ < 60) {
    spawnRow(game.genY);
    const h = -game.genY;
    game.genY -= rand(118, 150) + Math.min(h * 0.003, 36);
  }
}

/* =========================================================
   つぶつぶ（エフェクト）
   ========================================================= */
function addPart(p) { const P = game.parts; if (P.length > 340) P.shift(); p.t = 0; P.push(p); }
function floatText(x, y, s, c, size) { addPart({ type: 'text', x, y, s, c, size: size || 15, life: 0.9 }); }
function sparkBurst(x, y, n, cols, sp, size) {
  for (let k = 0; k < n; k++) {
    const a = rand(0, TAU), v = rand(0.4, 1) * sp;
    addPart({ type: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.45, 0.8), size: rand(0.7, 1.2) * size, c: cols[(Math.random() * cols.length) | 0] });
  }
}
function updateParts(dt) {
  const P = game.parts;
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    p.t += dt;
    if (p.t >= p.life) { P.splice(i, 1); continue; }
    switch (p.type) {
      case 'splash': case 'dust': p.vy += 420 * dt; p.x += p.vx * dt; p.y += p.vy * dt; break;
      case 'spark': case 'puff': { const f = Math.exp(-3 * dt); p.vx *= f; p.vy *= f; p.x += p.vx * dt; p.y += p.vy * dt; break; }
      case 'leaf':
        p.vy = Math.min(p.vy + 140 * dt, 70); p.vx *= Math.exp(-1.5 * dt);
        p.x += (p.vx + Math.sin(p.t * 4) * 30) * dt; p.y += p.vy * dt; p.rot += p.vr * dt; break;
      case 'text': p.y -= 30 * dt; break;
      default: break;
    }
  }
}

/* =========================================================
   当たり判定とできごと
   ========================================================= */
function tipCenter() { const t = game.tip; return { x: t.x + Math.sin(t.h) * 6, y: t.y - Math.cos(t.h) * 6 }; }
function collectDrop(e) {
  const g = game;
  e.dead = true;
  g.water = Math.min(100, g.water + e.amt);
  setFace('happy', 0.45);
  for (let k = 0; k < 10; k++) addPart({ type: 'splash', x: e.x, y: e.y, vx: rand(-90, 90), vy: rand(-150, 10), life: rand(0.4, 0.7), size: rand(1.8, 3.6) });
  addPart({ type: 'ring', x: e.x, y: e.y, life: 0.45, size: e.r, c: '#7fd3ff' });
  floatText(e.x, e.y - 16, '+' + e.amt, '#2f8fd0');
  sfx.drop(e.small);
}
function collectSun(e) {
  const g = game;
  e.dead = true;
  g.flowerN++;
  g.flowers.push({ i: Math.max(1, g.pts.length - 1), side: sign(), born: g.time, col: FLOWER_COLS[(Math.random() * FLOWER_COLS.length) | 0], r: rand(8, 11), rot: rand(0, TAU), n: Math.random() < 0.3 ? 6 : 5 });
  sparkBurst(e.x, e.y, 12, ['#fff3a0', '#ffd23f', '#ffffff'], 150, 4);
  addPart({ type: 'ring', x: e.x, y: e.y, life: 0.5, size: e.r, c: '#ffd23f' });
  setFace('happy', 0.6);
  g.sunG++;
  sfx.sun(g.sunG - 1);
  floatText(e.x, e.y - 18, 'ひかり ' + Math.min(g.sunG, 5) + '/5', '#d98f00', 13);
  if (g.sunG >= 5) {
    g.sunG = 0;
    if (g.boost > 0) g.boost += 4.5; else startBoost();
  }
}
function startBoost() {
  const g = game;
  g.boost = 4.5;
  g.water = Math.min(100, g.water + 35);
  toastT = 0; elToast.classList.remove('show'); toastQ.unshift('ぐんぐんタイム！');
  sfx.boost(); shake = 0.15;
  addPart({ type: 'ring', x: g.tip.x, y: g.tip.y, life: 0.6, size: 12, c: '#ffd23f', grow: 3 });
  sparkBurst(g.tip.x, g.tip.y, 20, ['#fff3a0', '#ffd23f', '#ffffff'], 220, 5);
}
function fling(e) {
  const g = game;
  if (e.type === 'storm') {
    e.dead = true;
    for (let k = 0; k < 14; k++) addPart({ type: 'puff', x: e.x + rand(-e.w * 0.4, e.w * 0.4), y: e.y + rand(-15, 10), vx: rand(-120, 120), vy: rand(-120, 60), life: rand(0.5, 0.9), size: rand(10, 18), c: '#6a6e8c' });
  } else {
    const dir = Math.sign(e.x - g.tip.x) || 1;
    e.fl = { vx: dir * rand(220, 320), vy: rand(-420, -300), vr: dir * rand(8, 14), rot: 0, t: 0 };
  }
  sparkBurst(e.x, e.y, 10, ['#fff3a0', '#ffffff'], 180, 4);
  floatText(e.x, e.y - 20, 'ポーン！', '#e07a00', 16);
  sfx.bonk(); shake = Math.max(shake, 0.12);
}
function hurt(e) {
  const g = game;
  if (g.boost > 0) { fling(e); return; }
  if (g.invuln > 0) return;
  g.water -= 22; g.invuln = 1.4; g.slow = 0.45; setFace('hurt', 0.8); shake = 0.35;
  const dir = Math.sign(g.tip.x - e.x) || sign();
  g.tip.kick = dir * 170;
  g.tip.h = clamp(g.tip.h + dir * 0.35, -MAXH, MAXH);
  if (e.type === 'bird' || e.type === 'rock') e.vx = -dir * Math.abs(e.vx);
  sfx.hit(); buzz(50);
  for (let k = 0; k < 3; k++) addPart({ type: 'leaf', x: g.tip.x, y: g.tip.y, vx: rand(-90, 90), vy: rand(-130, -40), life: 1.6, size: rand(5, 8), rot: rand(0, TAU), vr: rand(-6, 6) });
  sparkBurst(g.tip.x, g.tip.y - 6, 6, ['#ffffff', '#ffd0d0'], 140, 3.5);
  floatText(g.tip.x, g.tip.y - 26, '-22', '#ff5a45', 16);
}
function collide(e, c, dt) {
  const near = (x, y, r) => { const dx = c.x - x, dy = c.y - y; return dx * dx + dy * dy < r * r; };
  switch (e.type) {
    case 'drop': if (near(e.x, e.y, e.r + 13)) collectDrop(e); break;
    case 'sun': if (near(e.x, e.y, e.r + 14)) collectSun(e); break;
    case 'worm': {
      const dx = Math.sin(e.a), dy = Math.cos(e.a);
      if (near(e.x + dx * 14, e.y + dy * 14, 14.5) || near(e.x + dx * 37, e.y + dy * 37, 15.5)) hurt(e);
      break;
    }
    case 'bird': if (near(e.x, e.y, 19)) hurt(e); break;
    case 'rock': if (near(e.x, e.y, e.r + 6)) hurt(e); break;
    case 'storm': {
      const nx = (c.x - e.x) / (e.w * 0.5 + 4), ny = (c.y - (e.y - e.w * 0.05)) / (e.w * 0.24 + 5);
      if (nx * nx + ny * ny < 1) hurt(e);
      break;
    }
    case 'rain':
      if (Math.abs(c.x - e.x) < e.w * 0.42 && c.y > e.y && c.y < e.y + e.depth) {
        const g = game;
        g.water = Math.min(100, g.water + 26 * dt);
        if (g.faceT <= 0.1) setFace('happy', 0.2);
        g.rainSnd -= dt;
        if (g.rainSnd <= 0) {
          g.rainSnd = 0.12; sfx.rain();
          addPart({ type: 'splash', x: g.tip.x + rand(-6, 6), y: g.tip.y - 10, vx: rand(-60, 60), vy: rand(-90, -20), life: 0.4, size: rand(1.5, 2.8) });
        }
      }
      break;
    default: break;
  }
}
function updateEnts(dt) {
  const g = game, T = g.time, c = tipCenter(), vb = toWorldY(cssH) + 400;
  for (let i = g.ents.length - 1; i >= 0; i--) {
    const e = g.ents[i];
    if (e.fl) {
      e.x += e.fl.vx * dt; e.y += e.fl.vy * dt; e.fl.vy += 700 * dt; e.fl.rot += e.fl.vr * dt; e.fl.t += dt;
      if (e.fl.t > 2.5) g.ents.splice(i, 1);
      continue;
    }
    switch (e.type) {
      case 'worm': e.a = e.amp * Math.sin(T * e.w + e.ph); e.x = e.ax + Math.sin(e.a) * e.L; e.y = e.ay + Math.cos(e.a) * e.L; break;
      case 'bird': e.x += e.vx * dt; if ((e.x < 24 && e.vx < 0) || (e.x > W - 24 && e.vx > 0)) e.vx = -e.vx; break;
      case 'rock': e.x += e.vx * dt; e.rot += e.vr * dt; if ((e.x < e.r && e.vx < 0) || (e.x > W - e.r && e.vx > 0)) e.vx = -e.vx; break;
      case 'storm': e.flash = Math.max(0, e.flash - dt); if (Math.random() < dt * 0.7) { e.flash = 0.18; e.boltSeed = (Math.random() * 1e6) | 0; } break;
      default: break;
    }
    if (g.state === 'play' && !e.dead) collide(e, c, dt);
    if (e.dead || e.y > vb) g.ents.splice(i, 1);
  }
}
function emergeFX() {
  const t = game.tip;
  for (let k = 0; k < 16; k++) addPart({ type: 'dust', x: t.x + rand(-8, 8), y: 0, vx: rand(-110, 110), vy: rand(-220, -60), life: rand(0.5, 0.9), size: rand(2, 4.5), c: Math.random() < 0.5 ? '#a87547' : '#7a4f2c' });
  addPart({ type: 'ring', x: t.x, y: -6, life: 0.5, size: 8, c: '#ffffff' });
  sfx.pop(); toast('ぴょこっ！ 地上に出たよ'); setFace('happy', 0.8);
}
function checkMilestones() {
  const g = game;
  while (g.msNext < MILESTONES.length && g.height >= MILESTONES[g.msNext][0]) { toast(MILESTONES[g.msNext][1]); sfx.milestone(); g.msNext++; }
  if (g.height >= g.msExtra) { toast(`${Math.round(g.msExtra / 1000)}m！ まだまだ のびる！`); sfx.milestone(); g.msExtra += 5000; }
  if (!g.bestToast && g.bestCm >= 20 && g.height / 10 > g.bestCm) { g.bestToast = true; toast('ベスト こうしん！'); sfx.milestone(); }
}

/* =========================================================
   毎フレームの更新
   ========================================================= */
function updatePlay(dt) {
  const g = game, tip = g.tip;
  g.t += dt;
  const h = Math.max(0, -tip.y);
  const v = speedAt(h) * (g.boost > 0 ? 1.6 : 1) * (g.slow > 0 ? 0.55 : 1);

  // かじとり
  let target = 0;
  if (input.mode === 'keys') target = input.keyDir() * MAXH;
  else if (input.active) target = clamp((toWorldX(input.sx) - tip.x) / (0.5 * v), -1, 1) * MAXH;
  tip.h = clamp(tip.h + clamp((target - tip.h) * Math.min(1, dt * 8), -4 * dt, 4 * dt), -MAXH, MAXH);

  // のびる
  const ox = tip.x, oy = tip.y;
  tip.x += (Math.sin(tip.h) * v + tip.kick) * dt;
  tip.y -= Math.cos(tip.h) * v * dt;
  tip.kick *= Math.exp(-5 * dt);
  if (tip.x < 14) { tip.x = 14; if (tip.h < 0) tip.h *= 0.8; if (tip.kick < 0) tip.kick = 0; }
  else if (tip.x > W - 14) { tip.x = W - 14; if (tip.h > 0) tip.h *= 0.8; if (tip.kick > 0) tip.kick = 0; }
  g.pathLen += Math.hypot(tip.x - ox, tip.y - oy);
  const lp = g.pts[g.pts.length - 1];
  if (Math.hypot(tip.x - lp.x, tip.y - lp.y) >= 5) g.pts.push({ x: tip.x, y: tip.y, d: g.pathLen, g: g.boost > 0 ? 1 : 0 });

  // 葉っぱ
  if (g.pathLen >= g.nextLeaf) {
    if (tip.y < -12) {
      g.leaves.push({ i: g.pts.length - 1, side: g.leafSide, born: g.time, len: rand(24, 32), pal: (Math.random() * 3) | 0 });
      g.leafSide = -g.leafSide;
      g.nextLeaf = g.pathLen + (g.boost > 0 ? rand(32, 46) : rand(52, 78));
    } else g.nextLeaf = g.pathLen + 10;
  }

  if (!g.emerged && tip.y < -2) { g.emerged = true; emergeFX(); }
  g.height = Math.max(g.height, -tip.y);
  checkMilestones();

  // 水とタイマー
  if (g.boost > 0) {
    g.boost -= dt;
    if (Math.random() < dt * 30) addPart({ type: 'spark', x: tip.x + rand(-6, 6), y: tip.y + rand(0, 10), vx: rand(-30, 30), vy: rand(10, 60), life: 0.6, size: rand(2.5, 4.5), c: Math.random() < 0.5 ? '#fff3a0' : '#ffd23f' });
    if (g.boost <= 0) { g.boost = 0; g.invuln = Math.max(g.invuln, 0.9); }
  } else g.water -= drainAt(h) * dt;
  g.invuln = Math.max(0, g.invuln - dt);
  g.slow = Math.max(0, g.slow - dt);
  if (g.faceT > 0) g.faceT -= dt;
  if (g.faceT <= 0) g.face = g.water < 25 ? 'tired' : 'normal';

  genContent();
  updateEnts(dt);
  updateParts(dt);

  cam.x = W / 2; cam.z = 1;
  cam.y = g.t < 0.9 ? lerp(titleCamY(), followY(), easeInOut(g.t / 0.9)) : followY();

  if (g.hintT > 0) { g.hintT -= dt; if (g.hintT <= 0) elHint.classList.remove('show'); }
  if (g.water < 25 && g.water > 0) { g.warnT -= dt; if (g.warnT <= 0) { sfx.warn(); g.warnT = 1.5; } } else g.warnT = 0;

  if (g.water <= 0) { g.water = 0; updateHUD(); startEnding(); return; }
  updateHUD();
}
function updateEnding(dt) {
  const g = game;
  g.et += dt;
  const et = g.et;
  updateEnts(dt); updateParts(dt);
  g.tip.h *= Math.exp(-dt * 2);
  g.face = et < 0.6 ? 'tired' : et < 2.3 ? 'sleep' : 'happy';
  const f = g.fit, c0 = g.camFrom;
  const k = easeInOut(clamp((et - 0.6) / 1.7, 0, 1));
  const z = Math.exp(lerp(Math.log(c0.z), Math.log(f.z), k));
  const tipSyF = cssH / 2 + (g.tip.y - f.y) * S * f.z;
  const tsy = lerp(c0.tipSy, tipSyF, k);
  cam.x = W / 2; cam.z = z; cam.y = g.tip.y - (tsy - cssH / 2) / (S * z);
  if (et >= 2.3 && !g.bloomed) {
    g.bloomed = true; sfx.bloom(); toast('さいごに 花がさいた！');
    const ts = finaleScale(f.z);
    sparkBurst(g.tip.x, g.tip.y - 9 * ts, 26, ['#fff3a0', '#ffffff', g.flowerCol, '#ffd23f'], 260 * ts, 5 * ts);
    addPart({ type: 'ring', x: g.tip.x, y: g.tip.y - 9 * ts, life: 0.8, size: 14 * ts, c: '#ffffff', grow: 3 * ts });
  }
  g.bloom = easeOutBack(clamp((et - 2.3) / 0.9, 0, 1));
  if (et >= 3.1 && !g.resultShown) { g.resultShown = true; g.state = 'result'; elResult.classList.add('show'); }
}
function updateResult(dt) {
  const g = game;
  updateParts(dt);
  if (g.fit) { cam.z = g.fit.z; cam.y = g.fit.y; cam.x = W / 2; }
  if (Math.random() < dt * 2.5) {
    const ts = finaleScale(cam.z), a = rand(0, TAU), r = rand(26, 50) * ts;
    addPart({ type: 'spark', x: g.tip.x + Math.cos(a) * r, y: g.tip.y - 9 * ts + Math.sin(a) * r, vx: 0, vy: -10 * ts, life: 0.9, size: 3.5 * ts, c: Math.random() < 0.5 ? '#ffffff' : '#fff3a0' });
  }
}
function update(dt) {
  switch (game.state) {
    case 'play': updatePlay(dt); break;
    case 'ending': updateEnding(dt); break;
    case 'result': updateResult(dt); break;
    default: break;
  }
  if (shake > 0) shake = Math.max(0, shake - dt);
  updateToasts(dt);
}

/* =========================================================
   描く
   ========================================================= */
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.fill(); }
function puffCloud(x, y, w, h) {
  ctx.beginPath();
  ctx.ellipse(x, y + h * 0.1, w * 0.5, h * 0.36, 0, 0, TAU);
  const bumps = [[-0.26, -0.02, 0.36], [-0.04, -0.2, 0.5], [0.22, -0.12, 0.42]];
  for (const b of bumps) { const cx = x + b[0] * w, cy = y + b[1] * h, r = b[2] * h; ctx.moveTo(cx + r, cy); ctx.arc(cx, cy, r, 0, TAU); }
  ctx.fill();
}
function star4(x, y, r) {
  ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r);
  ctx.fill();
}

/* ----- 背景（画面座標） ----- */
function drawSky() {
  const top = toWorldY(0), bot = toWorldY(cssH);
  const gr = ctx.createLinearGradient(0, 0, 0, cssH);
  for (let i = 0; i <= 10; i++) { const f = i / 10; gr.addColorStop(f, rgb(skyAt(-lerp(top, bot, f)))); }
  ctx.fillStyle = gr; ctx.fillRect(0, 0, cssW, cssH);
}
function drawStars(T) {
  const scroll = -cam.y * 0.03 * S;
  ctx.fillStyle = '#ffffff';
  for (const s of STARS) {
    const sy = (((s.y * cssH + scroll) % cssH) + cssH) % cssH;
    const base = sstep(5500, 9500, -toWorldY(sy));
    if (base <= 0.01) continue;
    ctx.globalAlpha = base * (0.55 + 0.45 * Math.sin(T * s.sp + s.tw));
    circle(s.x * cssW, sy, s.r);
  }
  ctx.globalAlpha = 1;
}
function drawBgClouds(T) {
  const zf = sstep(0.55, 0.95, cam.z);
  if (zf <= 0) return;
  ctx.fillStyle = '#ffffff';
  for (const c of BGC) {
    const a = (0.5 + 0.3 * c.p) * zf * (1 - sstep(6000, 9000, c.H));
    if (a <= 0.02) continue;
    const sy = toScreenY(-c.H * c.p + cam.y * (1 - c.p));
    const size = c.s * 70 * S;
    if (sy < -size || sy > cssH + size) continue;
    const span = cssW + size * 2 + 100;
    const sx = ((c.fx * span + T * c.v * S) % span) - size - 50;
    ctx.globalAlpha = a;
    puffCloud(sx, sy, size, size * 0.45);
  }
  ctx.globalAlpha = 1;
}

/* ----- 地面 ----- */
function worldLR() { return [toWorldX(0) - 20, toWorldX(cssW) + 20]; }
function drawHills() {
  const [L, R] = worldLR(), st = Math.max(8, (R - L) / 160);
  ctx.fillStyle = '#cdeab9';
  ctx.beginPath(); ctx.moveTo(L, 4);
  for (let x = L; x <= R + st; x += st) ctx.lineTo(x, hill1(x));
  ctx.lineTo(R + st, 4); ctx.closePath(); ctx.fill();

  }
  ctx.fillStyle = e.flash > 0 ? '#8c90b0' : '#5d6180'; puffCloud(x, y, w, h);
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; puffCloud(x - w * 0.04, y - h * 0.14, w * 0.78, h * 0.6);
  const ey = y - w * 0.02;
  ctx.fillStyle = '#ffffff'; circle(x - w * 0.11, ey, 4.4); circle(x + w * 0.11, ey, 4.4);
  ctx.fillStyle = '#222'; circle(x - w * 0.11 + 0.8, ey + 1, 2.2); circle(x + w * 0.11 - 0.8, ey + 1, 2.2);
  ctx.strokeStyle = '#2a2c40'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - w * 0.11 - 6, ey - 7); ctx.lineTo(x - w * 0.11 + 4, ey - 4);
  ctx.moveTo(x + w * 0.11 + 6, ey - 7); ctx.lineTo(x + w * 0.11 - 4, ey - 4);
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 6, ey + 10); ctx.lineTo(x - 3, ey + 7); ctx.lineTo(x, ey + 10); ctx.lineTo(x + 3, ey + 7); ctx.lineTo(x + 6, ey + 10); ctx.stroke();
}
function drawRain(e, T) {
  const w = e.w, x = e.x, y = e.y;
  const gr = ctx.createLinearGradient(0, y, 0, y + e.depth);
  gr.addColorStop(0, 'rgba(120,190,255,0.28)'); gr.addColorStop(1, 'rgba(120,190,255,0)');
  ctx.fillStyle = gr; ctx.fillRect(x - w * 0.42, y, w * 0.84, e.depth);
  ctx.strokeStyle = 'rgba(70,150,230,0.75)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let k = 0; k < 9; k++) {
    const sx = x - w * 0.38 + (k / 8) * w * 0.76;
    for (let j = 0; j < 2; j++) {
      const off = (T * 260 + k * 47 + j * e.depth * 0.5) % e.depth;
      ctx.moveTo(sx - 1, y + off); ctx.lineTo(sx - 3, y + off + 11);
    }
  }
  ctx.stroke();
  ctx.fillStyle = '#dfe8f7'; puffCloud(x, y + 3, w, w * 0.42);
  ctx.fillStyle = '#ffffff'; puffCloud(x, y, w, w * 0.42);
  ctx.strokeStyle = '#5b6b8a'; ctx.lineWidth = 1.6;
  const ey = y - w * 0.03;
  ctx.beginPath(); ctx.arc(x - w * 0.1, ey, 3, 1.1 * Math.PI, 1.9 * Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(x + w * 0.1, ey, 3, 1.1 * Math.PI, 1.9 * Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, ey + 3, 3.5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.fillStyle = 'rgba(255,140,160,0.45)'; circle(x - w * 0.17, ey + 4, 3); circle(x + w * 0.17, ey + 4, 3);
}
function drawRock(e) {
  const f = e.vx >= 0 ? 1 : -1;
  ctx.save(); ctx.translate(e.x, e.y);
  ctx.fillStyle = 'rgba(255,170,90,0.35)';
  ctx.beginPath(); ctx.moveTo(0, -e.r * 0.75); ctx.lineTo(-f * e.r * 3.2, 0); ctx.lineTo(0, e.r * 0.75); ctx.closePath(); ctx.fill();
  ctx.rotate(e.rot);
  ctx.beginPath();
  for (let k = 0; k < e.shape.length; k++) {
    const a = k / e.shape.length * TAU, rr = e.r * e.shape[k];
    if (k === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fillStyle = '#8d7a6a'; ctx.fill(); ctx.strokeStyle = '#4f4136'; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.fillStyle = 'rgba(60,45,35,0.45)'; circle(-e.r * 0.3, -e.r * 0.2, e.r * 0.22); circle(e.r * 0.35, e.r * 0.25, e.r * 0.16);
  ctx.fillStyle = '#222'; circle(-e.r * 0.25, e.r * 0.05, 1.8); circle(e.r * 0.2, e.r * 0.05, 1.8);
  ctx.restore();
}
function drawEnts(rainLayer, alpha, vt, vb) {
  const T = game.time;
  for (const e of game.ents) {
    if ((e.type === 'rain') !== rainLayer) continue;
    if (e.y < vt - 260 || e.y > vb + 260) continue;
    ctx.globalAlpha = alpha;
    if (e.fl) { ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.fl.rot); ctx.translate(-e.x, -e.y); }
    switch (e.type) {
      case 'drop': drawDrop(e, T); break;
      case 'sun': drawSun(e, T); break;
      case 'worm': drawWorm(e, T); break;
      case 'bird': drawBird(e, T); break;
      case 'storm': drawStorm(e, T); break;
      case 'rain': drawRain(e, T); break;
      case 'rock': drawRock(e); break;
      default: break;
    }
    if (e.fl) ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function drawParts() {
  for (const p of game.parts) {
    const k = p.t / p.life, a = 1 - k;
    switch (p.type) {
      case 'splash': ctx.globalAlpha = a; ctx.fillStyle = '#7fd0ff'; circle(p.x, p.y, p.size); break;
      case 'dust': ctx.globalAlpha = a; ctx.fillStyle = p.c; circle(p.x, p.y, p.size); break;
      case 'puff': ctx.globalAlpha = a * 0.7; ctx.fillStyle = p.c; circle(p.x, p.y, p.size * (1 + k)); break;
      case 'spark': ctx.globalAlpha = a; ctx.fillStyle = p.c; star4(p.x, p.y, p.size * (1 - k * 0.5)); break;
      case 'ring':
        ctx.globalAlpha = a * 0.85; ctx.strokeStyle = p.c; ctx.lineWidth = (2.5 * (1 - k) + 0.6) * (p.grow ? Math.max(1, p.grow / 3) : 1);
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size + k * 26 * (p.grow || 1), 0, TAU); ctx.stroke(); break;
      case 'leaf': ctx.globalAlpha = Math.min(1, a * 2); drawLeaf(p.x, p.y, p.rot, p.size * 2.2, p.size * 0.75, 0); break;
      case 'text':
        ctx.globalAlpha = Math.min(1, a * 2.2);
        ctx.font = `800 ${p.size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round'; ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(255,255,255,0.95)';
        ctx.strokeText(p.s, p.x, p.y); ctx.fillStyle = p.c; ctx.fillText(p.s, p.x, p.y); break;
      default: break;
    }
  }
  ctx.globalAlpha = 1;
}
function drawZzz(T) {
  ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let k = 0; k < 3; k++) {
    const ph = (T * 0.5 + k / 3) % 1;
    ctx.globalAlpha = Math.sin(ph * Math.PI) * 0.9;
    ctx.font = `800 ${9 + ph * 7}px ${FONT}`;
    ctx.fillText('z', SEED.x + 14 + ph * 14, SEED.y - 26 - ph * 28);
  }
  ctx.globalAlpha = 1;
}
function drawOverlayFX(T) {
  const g = game;
  const colW = W * S * cam.z, ox = (cssW - colW) / 2, zf = sstep(0.85, 1, cam.z);
  if (ox > 2 && zf > 0) { // 遊べる場所のはし
    ctx.globalAlpha = zf;
    ctx.fillStyle = 'rgba(10,30,60,0.10)'; ctx.fillRect(0, 0, ox, cssH); ctx.fillRect(ox + colW, 0, ox + 1, cssH);
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(ox - 1, 0, 2, cssH); ctx.fillRect(ox + colW - 1, 0, 2, cssH);
    ctx.globalAlpha = 1;
  }
  if (g.state === 'play' || g.state === 'paused') {
    const R = Math.max(cssW, cssH);
    if (g.water < 25) {
      const a = (1 - g.water / 25) * (0.32 + 0.14 * Math.sin(T * 8));
      const gr = ctx.createRadialGradient(cssW / 2, cssH / 2, R * 0.3, cssW / 2, cssH / 2, R * 0.75);
      gr.addColorStop(0, 'rgba(255,80,60,0)'); gr.addColorStop(1, `rgba(255,80,60,${a.toFixed(3)})`);
      ctx.fillStyle = gr; ctx.fillRect(0, 0, cssW, cssH);
    }
    if (g.boost > 0) {
      const a = Math.min(1, g.boost) * (0.3 + 0.1 * Math.sin(T * 12));
      const gr = ctx.createRadialGradient(cssW / 2, cssH / 2, R * 0.3, cssW / 2, cssH / 2, R * 0.75);
      gr.addColorStop(0, 'rgba(255,220,80,0)'); gr.addColorStop(1, `rgba(255,210,60,${a.toFixed(3)})`);
      ctx.fillStyle = gr; ctx.fillRect(0, 0, cssW, cssH);
    }
  }
}
function render() {
  const g = game, T = g.time;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawSky();
  drawStars(T);
  drawBgClouds(T);

  const u = unit();
  let sx = 0, sy = 0;
  if (shake > 0) { const a = shake * 18; sx = rand(-a, a); sy = rand(-a, a); }
  ctx.setTransform(dpr * u, 0, 0, dpr * u, dpr * (cssW / 2 - cam.x * u + sx), dpr * (cssH / 2 - cam.y * u + sy));
  const vt = toWorldY(0), vb = toWorldY(cssH);
  const sb = sizeBoostFor(cam.z);
  const entA = g.state === 'ending' ? 1 - clamp((g.et - 0.6) / 1.0, 0, 1) : (g.state === 'result' ? 0 : 1);

  if (vt < 20 && vb > -160) drawHills();
  if (entA > 0) drawEnts(true, entA, vt, vb);
  if (vb > -20) drawSoil(vb, sb);
  drawPlant(vt, vb, sb, T);
  if (vb > -30 && vt < 30) drawGrass();
  if (entA > 0) drawEnts(false, entA, vt, vb);

  const t = g.tip;
  const fin = g.state === 'ending' || g.state === 'result';
  const tsc = (g.state === 'title' ? 0.85 : 1) * (fin ? finaleScale(cam.z) : sb) * (1 + clamp(g.bloom, 0, 1.2) * 0.35);
  const tang = t.h * 0.6 + (g.state === 'title' ? Math.sin(T * 1.5) * 0.06 : 0);
  if (g.state === 'play' && g.invuln > 0 && Math.floor(g.invuln * 12) % 2 === 0) ctx.globalAlpha = 0.45;
  drawSprout(t.x, t.y, tang, tsc, g.state === 'title' ? 'sleep' : g.face, g.boost > 0 && g.state === 'play', g.bloom, T);
  ctx.globalAlpha = 1;
  if (g.state === 'title') drawZzz(T);
  drawParts();

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawOverlayFX(T);
}

/* =========================================================
   画面サイズ・ループ
   ========================================================= */
function resize() {
  cssW = Math.max(1, window.innerWidth); cssH = Math.max(1, window.innerHeight);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(cssW * dpr)); canvas.height = Math.max(1, Math.round(cssH * dpr));
  S = Math.min(cssW / W, cssH / 620);
  if (game.state === 'title') { cam.z = 1; cam.x = W / 2; cam.y = titleCamY(); }
  else if (game.state === 'play' || game.state === 'paused') { cam.z = 1; cam.x = W / 2; cam.y = followY(); }
  layoutResult();
  if (game.state === 'ending' || game.state === 'result') {
    computeFit();
    if (game.state === 'result') { cam.z = game.fit.z; cam.y = game.fit.y; }
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.05) dt = 0.05;
  game.time += dt;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

resetGame();
resize();
refreshSoundBtn();
$('titleBest').textContent = game.bestCm > 0 ? `ベスト：${fmtTxt(game.bestCm)}` : '';
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
